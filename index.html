<div class="container">
    <!-- Dashboard Principal -->
    <div class="dashboard">
        <div class="card-dash main">
            <h3>Sueldo Bruto Acumulado</h3>
            <div class="value" id="valBruto">$0</div>
        </div>
        <div class="card-dash">
            <h3>Líquido (-14.5%)</h3>
            <div class="value" id="valLiquido" style="color: #424242;">$0</div>
        </div>
        <div class="card-dash">
            <h3>Total Pedidos</h3>
            <div class="value" id="valPedidos" style="color: #424242;">0</div>
        </div>
    </div>

    <!-- Ingreso de Datos -->
    <div class="card">
        <h2 class="card-title">➕ Ingresar Nuevo Pedido</h2>
        <label>Fecha</label>
        <input type="date" id="inputFecha">
        
        <label>Cantidad de SKU</label>
        <input type="number" id="inputSku" placeholder="Escribe aquí los SKU..." pattern="[0-9]*" inputmode="numeric">
        
        <button class="add-btn" onclick="guardarPedido()">Guardar Monto</button>
    </div>

    <!-- Historial de Pedidos -->
